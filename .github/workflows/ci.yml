name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      # Bandit - Python kodidagi xavfsizlik kamchiliklarini tekshiradi
      - name: Run Bandit (Security Audit)
        run: |
          pip install bandit
          bandit -r . -f txt -o report.txt
          
      # Testlarni ishga tushirish
      - name: Run Tests
        run: pytest